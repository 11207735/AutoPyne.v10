[package]
name = "agm-travel-management"
version = "1.0.0"
description = "AGM Travel Desktop Management System"
authors = ["AGM Travel"]
edition = "2021"

[lib]
name = "agm_travel_management_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
